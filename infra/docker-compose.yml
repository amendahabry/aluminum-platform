services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aluminum
      POSTGRES_PASSWORD: aluminum
      POSTGRES_DB: aluminum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aluminum"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  auth_service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.auth
    environment:
      DATABASE_URL: postgresql://aluminum:aluminum@postgres:5432/aluminum
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production-use-long-secret}
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  inventory_service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.inventory
    environment:
      DATABASE_URL: postgresql://aluminum:aluminum@postgres:5432/aluminum
      CORS_ORIGINS: "*"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  orders_service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.orders
    environment:
      DATABASE_URL: postgresql://aluminum:aluminum@postgres:5432/aluminum
      CORS_ORIGINS: "*"
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  production_service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.production
    environment:
      CORS_ORIGINS: "*"
    ports:
      - "8003:8003"

  ai_service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.ai
    environment:
      CORS_ORIGINS: "*"
    ports:
      - "8004:8004"

  notification_service:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.notification
    environment:
      CORS_ORIGINS: "*"
    ports:
      - "8005:8005"

  gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.gateway
    environment:
      AUTH_SERVICE_URL: http://auth_service:8000
      INVENTORY_SERVICE_URL: http://inventory_service:8001
      ORDERS_SERVICE_URL: http://orders_service:8002
      PRODUCTION_SERVICE_URL: http://production_service:8003
      AI_SERVICE_URL: http://ai_service:8004
      NOTIFICATION_SERVICE_URL: http://notification_service:8005
      CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      - auth_service
      - inventory_service
      - orders_service
      - production_service
      - ai_service
      - notification_service

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - gateway

volumes:
  postgres_data:
  minio_data:
