<div class="page-container">
  <div class="page-header">
    <h1>{{ 'orders.salesOrder' | translate }}</h1>
  </div>
  <p class="error" *ngIf="error">{{ error | translate }}</p>
  <div class="loading-state" *ngIf="loading">
    <span class="spinner"></span>
    <span>{{ 'app.loading' | translate }}</span>
  </div>
  <div class="table-card" *ngIf="!loading && items.length">
    <table class="table">
      <thead>
        <tr>
          <th>{{ 'orders.reference' | translate }}</th>
          <th>{{ 'orders.status' | translate }}</th>
          <th>Order date</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let o of items">
          <td>{{ o.reference || o.id }}</td>
          <td><span class="badge badge-{{ o.status }}">{{ o.status }}</span></td>
          <td>{{ o.order_date | date:'short' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="empty-state" *ngIf="!loading && !items.length">
    <p>No sales orders</p>
  </div>
</div>
