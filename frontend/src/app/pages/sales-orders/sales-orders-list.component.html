<div class="page-header">
  <h1>{{ 'orders.salesOrder' | translate }}</h1>
</div>
<p class="error" *ngIf="error">{{ error | translate }}</p>
<div *ngIf="loading">{{ 'app.loading' | translate }}</div>
<table *ngIf="!loading && items.length" class="table">
  <thead>
    <tr>
      <th>{{ 'orders.reference' | translate }}</th>
      <th>{{ 'orders.status' | translate }}</th>
      <th>Order date</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let o of items">
      <td>{{ o.reference || o.id }}</td>
      <td>{{ o.status }}</td>
      <td>{{ o.order_date | date:'short' }}</td>
    </tr>
  </tbody>
</table>
<p *ngIf="!loading && !items.length">No sales orders</p>
