<div class="page-container">
  <div class="page-header">
    <h1>{{ id ? ('orders.editQuote' | translate) : ('orders.createQuote' | translate) }}</h1>
    <a routerLink="/orders/quotes" class="btn-back">{{ 'app.back' | translate }}</a>
  </div>
  <div class="form-card">
    <form (ngSubmit)="submit()">
      <label>RFQ ID (optional)</label>
      <input type="text" [(ngModel)]="rfqId" name="rfqId" placeholder="Link to existing RFQ" />
      <label>{{ 'orders.reference' | translate }}</label>
      <input type="text" [(ngModel)]="reference" name="reference" placeholder="e.g. QT-001" />
      <label>Notes</label>
      <input type="text" [(ngModel)]="notes" name="notes" placeholder="Optional notes" />
      <p class="error" *ngIf="error">{{ error | translate }}</p>
      <button type="submit" [disabled]="loading" class="btn-submit">{{ loading ? ('app.loading' | translate) : ('app.save' | translate) }}</button>
    </form>
  </div>
</div>
