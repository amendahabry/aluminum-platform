<div class="page-header">
  <h1>{{ 'orders.quote' | translate }}</h1>
  <a routerLink="/orders/quotes/new" class="btn-primary">{{ 'orders.createQuote' | translate }}</a>
</div>
<p class="error" *ngIf="error">{{ error | translate }}</p>
<div *ngIf="loading">{{ 'app.loading' | translate }}</div>
<table *ngIf="!loading && items.length" class="table">
  <thead>
    <tr>
      <th>{{ 'orders.reference' | translate }}</th>
      <th>{{ 'orders.status' | translate }}</th>
      <th>{{ 'app.actions' | translate }}</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let q of items">
      <td>{{ q.reference || q.id }}</td>
      <td>{{ q.status }}</td>
      <td>
        <button *ngIf="q.status === 'draft' || q.status === 'sent'" (click)="approve(q.id)" class="btn-sm">{{ 'orders.approve' | translate }}</button>
      </td>
    </tr>
  </tbody>
</table>
<p *ngIf="!loading && !items.length">No quotes</p>
