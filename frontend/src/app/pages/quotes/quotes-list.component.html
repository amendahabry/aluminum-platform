<div class="page-container">
  <div class="page-header">
    <h1>{{ 'orders.quote' | translate }}</h1>
    <a routerLink="/orders/quotes/new" class="btn-primary">{{ 'orders.createQuote' | translate }}</a>
  </div>
  <p class="error" *ngIf="error">{{ error | translate }}</p>
  <div class="loading-state" *ngIf="loading">
    <span class="spinner"></span>
    <span>{{ 'app.loading' | translate }}</span>
  </div>
  <div class="table-card" *ngIf="!loading && items.length">
    <table class="table">
      <thead>
        <tr>
          <th>{{ 'orders.reference' | translate }}</th>
          <th>{{ 'orders.status' | translate }}</th>
          <th>{{ 'app.actions' | translate }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let q of items">
          <td>{{ q.reference || q.id }}</td>
          <td><span class="badge badge-{{ q.status }}">{{ q.status }}</span></td>
          <td>
            <button *ngIf="q.status === 'draft' || q.status === 'sent'" (click)="approve(q.id)" class="btn-approve">{{ 'orders.approve' | translate }}</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="empty-state" *ngIf="!loading && !items.length">
    <p>No quotes</p>
  </div>
</div>
