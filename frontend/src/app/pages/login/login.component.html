<div class="login-page">
  <div class="card">
    <h1>{{ 'auth.loginTitle' | translate }}</h1>
    <form (ngSubmit)="submit()">
      <label>{{ 'app.tenantSlug' | translate }}</label>
      <input type="text" [(ngModel)]="tenantSlug" name="tenantSlug" placeholder="acme" />
      <label>{{ 'app.email' | translate }}</label>
      <input type="email" [(ngModel)]="email" name="email" required />
      <label>{{ 'app.password' | translate }}</label>
      <input type="password" [(ngModel)]="password" name="password" required />
      <p class="error" *ngIf="error">{{ error | translate }}</p>
      <button type="submit" [disabled]="loading">{{ loading ? ('app.loading' | translate) : ('app.submit' | translate) }}</button>
    </form>
    <a routerLink="/register-tenant">{{ 'app.registerTenant' | translate }}</a>
  </div>
</div>
